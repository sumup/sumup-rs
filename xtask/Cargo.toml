[package]
name = "xtask"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
clap = { version = "4.6.1", features = [
  "derive",
  "string",
  "env",
  "wrap_help",
] }
codegen = { path = "../codegen" }
