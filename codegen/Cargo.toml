[package]
name = "codegen"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
heck = "0.5"
quote = "1.0"
proc-macro2 = "1.0"
# Keep Cargo 1.82 compatibility; indexmap 2.14's manifest uses edition 2024.
indexmap = "=2.13.0"
prettyplease = "0.3"
syn = { version = "3.0", features = ["full"] }
oas3 = "0.21"
