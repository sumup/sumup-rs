[package]
name = "codegen"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
heck = "0.5"
quote = "1.0"
proc-macro2 = "1.0"
indexmap = "2.13.0"
prettyplease = "0.3"
syn = { version = "3.0", features = ["full"] }
oas3 = "0.21"
